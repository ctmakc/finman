# FINMAN — single-service compose with a PERSISTENT SQLite database.
#
# Runtime parity with app.finman.money production:
#   - service/container name `finman`
#   - host binding 127.0.0.1:3011 -> container 3000 (Caddy proxies to 3011;
#     the port is never exposed on a public interface)
#   - named volume `finman-data` mounted at /app/data
#   - DATABASE_PATH=/app/data/finman.db (the file the prod volume already holds)
#
# Quick start:
#   cp .env.example .env   # then fill in real secrets
#   docker compose up -d --build
#   curl http://127.0.0.1:3011/api/health

services:
  finman:
    build:
      context: .
      dockerfile: Dockerfile
    image: finman:latest
    container_name: finman
    restart: unless-stopped

    # All configuration comes from .env (see .env.example for the full list).
    env_file:
      - .env

    # Force the DB path onto the persistent volume regardless of what .env says,
    # and default NODE_ENV to production for the container.
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      PORT: "3000"
      DATABASE_PATH: /app/data/finman.db

    # Host:Container. Bound to loopback only — the reverse proxy (Caddy) on the
    # host talks to 3011; the container always listens on 3000.
    ports:
      - "127.0.0.1:3011:3000"

    # Persistent storage for the SQLite database (+ /app/data/backups).
    volumes:
      - finman-data:/app/data

    # Container-level healthcheck mirrors the Dockerfile probe (kept here too
    # so `docker compose ps` reports health even for pre-built images).
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  finman-data:
    driver: local

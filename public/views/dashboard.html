<!-- Legacy HTML template for the dashboard page (placeholders are filled by the renderer). -->
<!-- Static labels carry data-i18n keys so i18n.translateDocument() localizes them after insertion. -->

<h1 class="page-title" data-i18n="dashboard.overview">Financial overview</h1>

<div class="dashboard-summary">
  <div class="summary-card income">
    <div class="summary-icon">
      <i class="fas fa-arrow-down"></i>
    </div>
    <div class="summary-data">
      <h3 data-i18n="dashboard.incomeMonth">Income this month</h3>
      <div class="summary-amount">{{monthlyIncome}}</div>
    </div>
  </div>

  <div class="summary-card expense">
    <div class="summary-icon">
      <i class="fas fa-arrow-up"></i>
    </div>
    <div class="summary-data">
      <h3 data-i18n="dashboard.expenseMonth">Expenses this month</h3>
      <div class="summary-amount">{{monthlyExpense}}</div>
    </div>
  </div>

  <div class="summary-card balance">
    <div class="summary-icon">
      <i class="fas fa-wallet"></i>
    </div>
    <div class="summary-data">
      <h3 data-i18n="analytics.totalBalance">Total balance</h3>
      <div class="summary-amount">{{totalBalance}}</div>
    </div>
  </div>
</div>

<div class="dashboard-content">
  <div class="dashboard-section">
    <div class="section-header">
      <h2 data-i18n="dashboard.yourAccounts">Your accounts</h2>
      <button id="add-account-btn" class="btn btn-sm btn-primary">
        <i class="fas fa-plus"></i> <span data-i18n="dashboard.addAccount">Add account</span>
      </button>
    </div>

    <div class="accounts-list">
      {{accountsHtml}}
    </div>
  </div>

  <div class="dashboard-section">
    <div class="section-header">
      <h2 data-i18n="widget.recent">Recent transactions</h2>
      <button id="add-transaction-btn" class="btn btn-sm btn-primary">
        <i class="fas fa-plus"></i> <span data-i18n="dashboard.addTransaction">Add transaction</span>
      </button>
    </div>

    <div class="transactions-list">
      {{transactionsHtml}}
    </div>

    <div class="section-footer">
      <a href="#" class="btn btn-sm btn-outline" id="view-all-transactions" data-i18n="dashboard.viewAllTx">
        View all transactions
      </a>
    </div>
  </div>
</div>

<div class="dashboard-charts">
  <div class="chart-container">
    <h2 data-i18n="dashboard.trendChart">Income and expense trend</h2>
    <canvas id="income-expense-chart"></canvas>
  </div>

  <div class="chart-container">
    <h2 data-i18n="analytics.byCategory">Expenses by category</h2>
    <canvas id="expense-categories-chart"></canvas>
  </div>
</div>

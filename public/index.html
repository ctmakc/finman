<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#5D5CDE">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Finman">
  <meta name="description" content="Finman is a personal finance manager with an AI CFO: accounts, transactions, budgets, goals, debts, investments and net worth in one place.">

  <title>Finman</title>

  <link rel="manifest" href="/manifest.json">
  <link rel="icon" type="image/svg+xml" href="/icons/icon.svg">
  <link rel="apple-touch-icon" href="/icons/icon-192.png">

  <!-- Vendor assets are self-hosted (CSP 'self', works offline). Typography uses the
       system stack via --fm-font-ui / --fm-font-num until the self-hosted type wave. -->
  <link rel="preload" href="/vendor/webfonts/fa-solid-900.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="/vendor/fa.min.css">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <div id="app">
    <div class="loading-screen">
      <div class="spinner"></div>
      <p>Loading Finman…</p>
    </div>
  </div>

  <script src="/vendor/chart.min.js"></script>
  <!-- Locale dictionaries, then the i18n and theme runtimes, must load before app.js -->
  <script src="/js/locales/en.js"></script>
  <script src="/js/locales/uk.js"></script>
  <script src="/js/locales/ru.js"></script>
  <script src="/js/i18n.js"></script>
  <script src="/js/theme.js"></script>
  <script src="/js/lib/a11y.js"></script>
  <script src="/js/app.js"></script>
  <script src="/js/auth.js"></script>
  <script src="/js/accounts.js"></script>
  <script src="/js/transactions.js"></script>
  <script src="/js/budgets.js"></script>
  <script src="/js/family.js"></script>
  <script src="/js/recurring.js"></script>
  <script src="/js/currency.js"></script>
  <script src="/js/goals.js"></script>
  <script src="/js/debts.js"></script>
  <script src="/js/split.js"></script>
  <script src="/js/investments.js"></script>
  <script src="/js/analytics.js"></script>
  <script src="/js/subscriptions.js"></script>
  <script src="/js/networth.js"></script>
  <script src="/js/receipts.js"></script>
  <script src="/js/calendar.js"></script>
  <script src="/js/reports.js"></script>
  <script src="/js/forecast.js"></script>
  <script src="/js/dashboard.js"></script>
  <script src="/js/bank-api.js"></script>
  <script src="/js/charts.js"></script>
  <!-- AI CFO module -->
  <script src="/js/ai.js"></script>
  <!-- Wave-2 modules -->
  <script src="/js/widgets.js"></script>
  <script src="/js/onboarding.js"></script>
  <script src="/js/offline.js"></script>
  <script src="/js/data-export.js"></script>
  <script src="/js/rules.js"></script>
  <script src="/js/reconcile.js"></script>
  <script src="/js/api-tokens.js"></script>
  <script src="/js/billing.js"></script>

  <!-- Service Worker registration + PWA install prompt -->
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/sw.js')
          .then(reg => console.log('SW registered:', reg.scope))
          .catch(err => console.log('SW registration failed:', err));
      });
    }

    let deferredPrompt;
    window.addEventListener('beforeinstallprompt', (e) => {
      e.preventDefault();
      deferredPrompt = e;
      const installBtn = document.getElementById('install-btn');
      if (installBtn) installBtn.style.display = 'block';
    });

    function installPWA() {
      if (deferredPrompt) {
        deferredPrompt.prompt();
        deferredPrompt.userChoice.then((choice) => {
          if (choice.outcome === 'accepted') {
            console.log('App installed');
          }
          deferredPrompt = null;
        });
      }
    }
  </script>
</body>
</html>

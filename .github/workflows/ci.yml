name: CI

# Run on pushes and PRs targeting the main feature branches.
on:
  push:
    branches: [main, master, feat/finman-overhaul]
  pull_request:

# Cancel superseded runs on the same ref to save CI minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Lint deps & run tests (Node 22)
    runs-on: ubuntu-latest

    env:
      NODE_ENV: test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # Reproducible install from the lockfile (includes devDeps: jest/supertest).
      - name: Install dependencies
        run: npm ci

      # Jest + Supertest. package.json "test" => "jest --runInBand".
      # The test harness binds each suite to an isolated temp SQLite DB.
      - name: Run tests
        run: npm test

  docker-build:
    name: Build Docker image
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Sanity-check that the production image builds. Not pushed anywhere.
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: finman:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

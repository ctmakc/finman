<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>Finman</title>
<style>
  :root { color-scheme: light dark; --bg: #F1F4F9; --card: #FFFFFF; --ink: #121A2E; --ink2: #4A5570; --primary: #2B50F0; --on: #FEFEFF; }
  @media (prefers-color-scheme: dark) { :root { --bg: #0B101B; --card: #151C2B; --ink: #EEF2FA; --ink2: #AEB8CD; --primary: #8098FF; --on: #0B101B; } }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink); overscroll-behavior: none; }
  body { font: 16px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; display: flex; align-items: center; justify-content: center;
    padding: calc(24px + var(--safe-area-inset-top, env(safe-area-inset-top, 0px))) 24px calc(24px + var(--safe-area-inset-bottom, env(safe-area-inset-bottom, 0px))); -webkit-user-select: none; user-select: none; }
  .card { width: 100%; max-width: 360px; background: var(--card); border-radius: 24px; padding: 32px 24px; text-align: center; box-shadow: 0 1px 2px rgba(18,26,46,.06), 0 12px 32px rgba(18,26,46,.08); }
  .mark { width: 64px; height: 64px; border-radius: 18px; margin: 0 auto 20px; background: var(--primary); display: grid; place-items: center; }
  .mark svg { width: 34px; height: 34px; }
  h1 { font-size: 22px; line-height: 1.25; margin: 0 0 8px; font-weight: 650; }
  p { margin: 0 0 24px; color: var(--ink2); }
  button { appearance: none; border: 0; width: 100%; min-height: 52px; border-radius: 999px; background: var(--primary); color: var(--on); font: 600 17px/1 inherit; font-family: inherit; cursor: pointer; }
  button:active { transform: scale(.98); }
  .hint { margin-top: 16px; font-size: 13px; color: var(--ink2); min-height: 1.5em; }
</style>
</head>
<body>
  <main class="card" role="main">
    <div class="mark" aria-hidden="true">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="color:var(--on)"><path d="M2 8.8a15 15 0 0 1 20 0"/><path d="M5 12.86a10 10 0 0 1 14 0"/><path d="M8.5 16.43a5 5 0 0 1 7 0"/><line x1="2" y1="2" x2="22" y2="22"/></svg>
    </div>
    <h1>You're offline</h1>
    <p>Finman needs an internet connection to sync your accounts. Check Wi‑Fi or mobile data, then try again.</p>
    <button id="retry" type="button">Try again</button>
    <div class="hint" id="hint" aria-live="polite"></div>
  </main>
<script>
  (function () {
    var APP = 'https://app.finman.money/';
    var hint = document.getElementById('hint');
    function go() {
      hint.textContent = 'Connecting…';
      fetch(APP + 'api/health', { cache: 'no-store', mode: 'no-cors' })
        .then(function () { window.location.replace(APP); })
        .catch(function () { hint.textContent = 'Still no connection. We will retry automatically.'; });
    }
    document.getElementById('retry').addEventListener('click', go);
    window.addEventListener('online', go);
    setInterval(function () { if (navigator.onLine) go(); }, 15000);
  })();
</script>
</body>
</html>
